name: verify-against-libcint

# The claim libfint makes is that it reproduces libcint bit for bit.  This is
# the workflow that checks it, and it is the only one that needs a C compiler.
#
# It builds against libcint's CURRENT master rather than a pinned release, on
# purpose.  A red run here is informative in a way a pinned run would not be:
#
#   catalogue_check fails         upstream changed a kernel, and the Fortran
#                                 generator has not been told
#   integral_coverage fails       upstream added an integral; copy its
#                                 description into scripts/gen_f90_all.cl
#   build fails                   upstream changed its build or its headers
#
# Any of those means work to do here, which is the point.  To reproduce an
# older run, pass a ref: scripts/fetch_libcint.sh v6.1.3
on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  Verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two compiler families, because a bit-identity claim that only holds
        # under one compiler is not much of a claim.  Both need -fp-model or
        # equivalent: see src/CMakeLists.txt, where the Intel flags live.
        toolchain:
          - {compiler: gcc, version: 13}
          - {compiler: intel, version: '2025.0'}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.x
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Install ninja
      run: pip install --upgrade ninja

    - name: Setup Fortran compiler
      uses: fortran-lang/setup-fortran@v1.9.0
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - name: Fetch libcint
      run: scripts/fetch_libcint.sh ${{ github.event_name == 'schedule' && 'master' || 'master' }}

    - name: Record which libcint this is
      run: |
        echo "libcint fetched at $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
        if [ -f extern/libcint/CMakeLists.txt ]; then
          grep -m3 -E 'cint_VERSION_(MAJOR|MINOR|PATCH)' extern/libcint/CMakeLists.txt \
            >> "$GITHUB_STEP_SUMMARY" || true
        fi

    - name: Configure with CMake
      run: >-
        cmake -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DLIBFINT_BUILD_TESTS=ON
        -S . -B build

    - name: Build
      run: cmake --build build --parallel

    - name: catch build fail
      if: ${{ failure() }}
      run: cmake --build build --verbose --parallel 1

    - name: Verify
      run: >-
        ctest
        --test-dir build
        --parallel
        --output-on-failure
        --no-tests=error

    - name: Summarise the catalogue
      if: ${{ always() }}
      run: |
        if [ -x build/test/catalogue_check ]; then
          {
            echo '```'
            ./build/test/catalogue_check || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
