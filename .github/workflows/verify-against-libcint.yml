name: verify-against-libcint

# The claim libfint makes is that it reproduces libcint bit for bit.  This is
# the workflow that checks it, and it is the only one that needs a C compiler.
#
# It builds against libcint's CURRENT master rather than a pinned release, on
# purpose.  A red run here is informative in a way a pinned run would not be:
#
#   catalogue_check fails         upstream changed a kernel, and the Fortran
#                                 generator has not been told
#   integral_coverage fails       upstream added an integral; copy its
#                                 description into scripts/gen_f90_all.cl
#   build fails                   upstream changed its build or its headers
#
# Any of those means work to do here, which is the point.  To reproduce an
# older run, pass a ref: scripts/fetch_libcint.sh v6.1.3
on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 3'

permissions:
  contents: read

# A new push wins: cancel whatever is still in flight for the same branch.
# event_name is in the key because a push to a PR branch fires this workflow
# twice -- once as `push`, once as `pull_request` -- and a single group would
# have the two runs of one commit cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  Verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two compiler families, because a bit-identity claim that only holds
        # under one compiler is not much of a claim.  Both need -fp-model or
        # equivalent: see src/CMakeLists.txt, where the Intel flags live.
        #
        # 2026.0 and not 2025.0, which miscompiles l_shell_check and
        # l_shell_grad_check.  The symptom is a shell count that reads back as
        # an `nao` near 1e9; instrumenting it shows every argument arriving at
        # the table writer correctly and the scalar shell counter ending up
        # right, while the writes into the table itself never land.  It
        # survives an explicit-shape dummy, removing the array dummy entirely
        # so the writes go to the host-associated array, and -O0.  gfortran
        # under -fcheck=all is clean, and four minimal reproductions of the
        # pattern all pass under Intel, so there is no small case to report.
        #
        # What says this is the compiler and not the library: on 2025.0 the
        # other 27 checks pass, catalogue_check and int2e_check among them, and
        # those are the ones that hold every integral to libcint bit for bit.
        # Two test harnesses miscompile; the integrals do not.  ifx 2026.0
        # produces numbers identical to gfortran's to the last digit.
        #
        # 2025.0 keeps its place in multi-compiler-ci.yml, which builds without
        # running, so the library is still known to compile there.
        toolchain:
          - {compiler: gcc, version: 13}
          - {compiler: intel, version: '2026.0'}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python 3.x
      uses: actions/setup-python@v6
      with:
        python-version: 3.x

    - name: Install ninja
      run: pip install --upgrade ninja

    - name: Setup Fortran compiler
      uses: fortran-lang/setup-fortran@v1.10.0
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - name: Fetch libcint
      # always upstream's master: this workflow is a drift detector, so a pin
      # here would defeat it.  Pass a ref locally to reproduce an old run.
      run: scripts/fetch_libcint.sh master

    - name: Record which libcint this is
      run: |
        echo "libcint fetched at $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
        if [ -f extern/libcint/CMakeLists.txt ]; then
          grep -m3 -E 'cint_VERSION_(MAJOR|MINOR|PATCH)' extern/libcint/CMakeLists.txt \
            >> "$GITHUB_STEP_SUMMARY" || true
        fi

    - name: Configure with CMake
      run: >-
        cmake -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DLIBFINT_BUILD_TESTS=ON
        -S . -B build

    - name: Build
      run: cmake --build build --parallel

    - name: catch build fail
      if: ${{ failure() }}
      run: cmake --build build --verbose --parallel 1

    - name: Verify
      run: >-
        ctest
        --test-dir build
        --parallel
        --output-on-failure
        --no-tests=error

    - name: Summarise the catalogue
      if: ${{ always() }}
      run: |
        if [ -x build/test/catalogue_check ]; then
          {
            echo '```'
            ./build/test/catalogue_check || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
