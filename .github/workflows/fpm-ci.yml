name: fpm

# fpm earns its place here rather than being a packaging convenience: its
# debug profile builds at -O0 with -fcheck=bounds and -fbacktrace, and that
# has already caught two bugs the CMake build could not, because CMake only
# ever builds this optimised.
#
#   an `inline` with no `static` linked at -O2 (inlined away) and not at -O0
#   a `use_opt .and. ws_opt_idx(...)` guard that assumed short-circuit
#     evaluation, which Fortran does not guarantee -- gfortran short-circuits
#     at -O2 and does not at -O0
#
# So: debug first, release second, and treat a debug-only failure as a real
# bug rather than an fpm quirk.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 3'

permissions:
  contents: read

# A new push wins: cancel whatever is still in flight for the same branch.
# event_name is in the key because a push to a PR branch fires this workflow
# twice -- once as `push`, once as `pull_request` -- and a single group would
# have the two runs of one commit cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fpm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain:
          - {compiler: gcc, version: 13}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Fortran compiler
      uses: fortran-lang/setup-fortran@v1.10.0
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    # v10, not v5, and for two reasons.  fpm's release assets grew a compiler
    # suffix -- fpm-0.12.0-linux-x86_64-gcc-12, where it used to be
    # fpm-0.12.0-linux-x86_64 -- and v5 does not know to look for it, so it
    # fails to find EVERY recent release.  v10 tries gcc-10 through gcc-14.
    # v5 also runs on node20, which GitHub is retiring; v10 is node24.
    - name: Setup fpm
      uses: fortran-lang/setup-fpm@v10
      with:
        fpm-version: 'v0.12.0'

    - name: Build and test, debug
      run: fpm test

    - name: Build and test, release
      run: fpm test --profile release
