name: Conda multi-OS multi-compiler

# Thanks to https://github.com/gha3mi/setup-fortran-conda for setting this up.
# MIT licensed.  Modelled on the same workflow in JorgeG94/pic.
#
# This covers what multi-compiler-ci.yml does not: LLVM flang-new, and macOS.
# Between the two, the compilers this library is known to build under are
# gfortran 11-15, ifx, ifort, flang-new and aocc's flang -- and the one it
# cannot, nvfortran, for the real128 reason spelled out in the other file.
#
# Build only.  Verification needs libcint and a C compiler; that is
# verify-against-libcint.yml's job.
on:
  push:
  pull_request:
  # Weekly, to catch toolchain drift with no change here.
  schedule:
    - cron: '0 12 * * 3'

permissions:
  contents: read

# A new push wins: cancel whatever is still in flight for the same branch.
# event_name is in the key because a push to a PR branch fires this workflow
# twice -- once as `push`, once as `pull_request` -- and a single group would
# have the two runs of one commit cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fpm:
    name: ${{ matrix.os }}_${{ matrix.compiler }}_fpm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gfortran, ifx, flang-new]
        exclude:
          # ifx has no macOS build, and flang-new has no conda-forge package
          # there either.  Windows is left out entirely: this library has no
          # Windows consumer yet, and adding one untested platform per
          # workflow is how a matrix stops being read.
          - {os: macos-latest, compiler: ifx}
          - {os: macos-latest, compiler: flang-new}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@v0.17.1
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler == 'flang-new' && '22.1.8' || '' }}
          platform: ${{ matrix.os }}

      - name: fpm versioning
        run: fpm --version

      - name: fpm build (debug)
        run: fpm build --compiler ${{ matrix.compiler }} --profile debug

      # Release too: the debug profile is what catches the bugs -O2 hides, and
      # the release profile is what anyone actually ships.  Both have found
      # something here.
      - name: fpm build (release)
        run: fpm build --compiler ${{ matrix.compiler }} --profile release

  cmake:
    name: ${{ matrix.os }}_${{ matrix.compiler }}_cmake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gfortran, ifx, flang-new]
        exclude:
          - {os: macos-latest, compiler: ifx}
          - {os: macos-latest, compiler: flang-new}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@v0.17.1
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler == 'flang-new' && '22.1.8' || '' }}
          platform: ${{ matrix.os }}
          extra-packages: "cmake, ninja"

      - name: cmake build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=${{ matrix.compiler }}
          cmake --build build
